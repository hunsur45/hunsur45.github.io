<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: rgba(0, 0, 0, 0.15);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 16px;
    }

    nav a:hover {
      color: #222;
    }

    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero-content {
      max-width: 700px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: white;
      color: #1687e8;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #222;
      color: white;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      nav {
        padding: 15px 5%;
      }

      nav a {
        margin-left: 10px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo"></div>

    <div>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Welcome!</h1>

      <p>
        A warm Welcome to you .  
        I'm glad you're here. Explore the website and discover something amazing!
      </p>

      <a href="#" class="btn">Get Started</a>
    </div>
  </section>

</body>
</html>
